name: Metrics
on:
  schedule: [{ cron: "0 4 * * *" }]
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/metrics.yml", "scripts/**"]

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Stats cards
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          node scripts/cards.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics
          git diff --cached --quiet || { git commit -m "chore: refresh stats cards" && git push; }
