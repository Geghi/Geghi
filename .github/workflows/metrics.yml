name: Metrics
on:
  schedule: [{ cron: "0 4 * * *" }]
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/metrics.yml"]

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Overview
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/overview.svg
          template: classic
          base: header, activity, community, repositories
          config_timezone: Europe/Rome
          config_display: large
          repositories_affiliations: owner, collaborator

      - name: Contribution calendar
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/isocalendar.svg
          base: ""
          config_timezone: Europe/Rome
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Languages
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/languages.svg
          base: ""
          config_timezone: Europe/Rome
          plugin_languages: yes
          plugin_languages_sections: most-used, recently-used
          plugin_languages_indepth: no
          plugin_languages_ignored: html, css, scss, jupyter notebook, makefile, dockerfile
          plugin_languages_limit: 8

      - name: Achievements
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/achievements.svg
          base: ""
          config_timezone: Europe/Rome
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: B
          plugin_achievements_secrets: yes

  snake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk@v3.5.0
        with:
          github_user_name: Geghi
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark
      - uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
